# Loaded on top of src/main/resources/application.properties (classpath:/config/ wins).
# Tests call the scheduler jobs themselves; a background run would touch the shared database.
app.scheduling.enabled=false

# Faster tests: a weak BCrypt (most tests register users) and one shared Spring context. Every test class uses the
# same settings, so the context is started once; a class with its own properties (SimulatedPaymentDisabledTest)
# starts another one.
app.security.bcrypt-strength=4
app.payments.simulated=true

# No real email from tests (FakeEmailSender replaces the sender anyway).
app.mail.resend-api-key=
app.mail.redirect-to=
