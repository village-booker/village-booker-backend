# App
spring.application.name=village-booker
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Terms of use: current versions; stored on the user when accepted
app.terms.version=2026-10
app.terms.host-version=2026-10

# CORS: frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Server
server.port=8080
