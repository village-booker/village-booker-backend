# App
spring.application.name=village-booker
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# BCrypt cost (2^n rounds); tests use 4
app.security.bcrypt-strength=10

# Forgot password: the link in the email is link + token (a frontend page); valid for timeout, and at most one
# new link per user every min-interval
app.password-reset.link=${FRONTEND_URL:http://localhost:5173}/reset-password?token=
app.password-reset.timeout=1h
app.password-reset.min-interval=1m

# Terms of use: current versions; stored on the user when accepted
app.terms.version=2026-10
app.terms.host-version=2026-10

# Jackson 3 rejects a missing primitive (null for a boolean field); Jackson 2 read it as false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Bookings: time to leave AWAITING_OWNER_APPROVAL / AWAITING_PAYMENT before the booking expires; never later than
# the start of the stay / tour, or a tour's minimum deadline while it is ahead
app.booking.owner-approval-timeout=24h
app.booking.payment-timeout=24h
# Scheduler (spec 8): pause between two runs (expiry, tour minimum, completion)
app.booking.scheduler-delay=PT1M
app.scheduling.enabled=true

# No payment provider yet: true adds POST /api/bookings/{id}/pay, which confirms a deposit without real money.
# Local development and tests only, never in production.
app.payments.simulated=${PAYMENTS_SIMULATED:false}

# CORS: frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Cloudinary (listing images); keys from .env, never in the frontend
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Emails (spec 14): saved to email_message and sent through Resend right after commit (failed -> FAILED, the
# admin sends it again). API_MAIL empty = not sent, emails stay PENDING.
# Without its own domain Resend sends only from onboarding@resend.dev and only to the Resend account's address,
# so in development MAIL_REDIRECT_TO sends every email there.
app.mail.resend-api-key=${API_MAIL:}
app.mail.from=${MAIL_FROM:Village Booker <onboarding@resend.dev>}
app.mail.redirect-to=${MAIL_REDIRECT_TO:}

# Uploads: one image per request, checked again in ListingImageService
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Server
server.port=8080
